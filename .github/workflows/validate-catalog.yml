name: Validate toolbox data

on:
  push:
    paths:
      - "catalog/**"
      - "inbox/**"
      - "state/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - "catalog/**"
      - "inbox/**"
      - "state/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_inbox.py
