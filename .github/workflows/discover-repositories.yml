name: Discover new repositories

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: toolbox-discovery
  cancel-in-progress: false

env:
  AUTOMATION_BRANCH: automation/toolbox-discovery
  TOOLBOX_OWNER: embaya

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare reusable automation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          if git fetch origin "$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH" 2>/dev/null; then
            git checkout -B "$AUTOMATION_BRANCH" "origin/$AUTOMATION_BRANCH"
            git rebase origin/master
          else
            git checkout -B "$AUTOMATION_BRANCH" origin/master
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover Stars and forks
        env:
          TOOLBOX_GITHUB_TOKEN: ${{ secrets.TOOLBOX_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/discover_repositories.py \
            --owner "$TOOLBOX_OWNER" \
            --result "$RUNNER_TEMP/discovery-result.json"
          cat "$RUNNER_TEMP/discovery-result.json"

      - name: Validate generated data
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/validate_catalog.py
          python scripts/validate_inbox.py

      - name: Commit discovery changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- inbox/pending.jsonl state/discovery.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(toolbox): sync Stars and forks"
          git push --force-with-lease origin "$AUTOMATION_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or refresh review PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$AUTOMATION_BRANCH" --base master --state open --json number --jq '.[0].number // empty')"
          body_file="$RUNNER_TEMP/pr-body.md"
          result="$(cat "$RUNNER_TEMP/discovery-result.json")"
          cat > "$body_file" <<EOF
          ## Automated toolbox discovery

          This PR synchronizes the current GitHub Stars + owned forks into the **review inbox**.
          It never edits curated \`catalog/*.jsonl\` entries automatically.

          Discovery result:
          \`\`\`json
          $result
          \`\`\`

          Review \`inbox/pending.jsonl\`, classify useful candidates, and then move approved entries into the curated catalog.

          > Source mode is \`authenticated\` when \`TOOLBOX_GITHUB_TOKEN\` belongs to \`$TOOLBOX_OWNER\`; otherwise discovery is limited to public GitHub data.
          EOF
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --body-file "$body_file"
          else
            gh pr create \
              --draft \
              --base master \
              --head "$AUTOMATION_BRANCH" \
              --title "chore(toolbox): review newly discovered repositories" \
              --body-file "$body_file"
          fi
